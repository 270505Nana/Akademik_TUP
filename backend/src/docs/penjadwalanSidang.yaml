  /api/penjadwalan-sidang/{id}/toggle-lock:
    patch:
      summary: Toggle lock status of sidang registration (Admin only)
      description: Mengunci atau membuka status penguncian sidang. Status isLocked ditujukan khusus untuk membatasi dosen/Ketua KK agar tidak dapat mengubah penguji setelah dikunci.
      tags:
        - Penjadwalan Sidang
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: Sidang registration ID (UUID)
      responses:
        "200":
          description: Status kunci pendaftaran sidang berhasil diperbarui
          content:
            application/json:
              example:
                message: Pendaftaran sidang berhasil dikunci
                data:
                  id: d1a2b3c4-e5f6-7a8b-9c0d-1e2f3a4b5c6d
                  isLocked: true
                  status: Siap Sidang
                  statusPenjadwalan: Siap Sidang
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Pendaftaran sidang berhasil dikunci
                  data:
                    $ref: "#/components/schemas/PenjadwalanSidangItem"
        "401":
          description: Unauthorized
        "403":
          description: Access denied (Hanya admin yang dapat mengakses)
        "404":
          description: Sidang registration not found

  /api/penjadwalan-sidang/period/{sidangPeriodId}/toggle-publish:
    patch:
      summary: Toggle publish status of sidang period to mahasiswa (Admin only)
      description: Mempublikasikan atau membatalkan publikasi seluruh jadwal sidang pada periode tertentu kepada mahasiswa.
      tags:
        - Penjadwalan Sidang
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: sidangPeriodId
          required: true
          schema:
            type: string
            format: uuid
          description: ID Periode Sidang (UUID)
      responses:
        "200":
          description: Status publikasi jadwal sidang untuk periode ini berhasil diperbarui
          content:
            application/json:
              example:
                message: Jadwal sidang untuk periode ini berhasil dipublikasikan ke mahasiswa
                data:
                  id: p1a2b3c4-e5f6-7a8b-9c0d-1e2f3a4b5c6d
                  name: Periode Sidang Semester Ganjil 2026/2027
                  academicYear: "2026/2027"
                  semester: GANJIL
                  startDate: "2026-11-01T00:00:00.000Z"
                  endDate: "2026-11-30T23:59:59.000Z"
                  category: pendaftaran
                  isOpen: true
                  isPublished: true
                  createdAt: "2026-10-15T08:00:00.000Z"
                  updatedAt: "2026-11-19T08:00:00.000Z"
                  deletedAt: null
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Jadwal sidang untuk periode ini berhasil dipublikasikan ke mahasiswa
                  data:
                    type: object
        "401":
          description: Unauthorized
        "403":
          description: Access denied (Hanya admin yang dapat mengakses)
        "404":
          description: Periode sidang tidak ditemukan

  /api/penjadwalan-sidang/{id}/toggle-read-info-penjadwalan:
    patch:
      summary: Tandai info penjadwalan sidang telah dibaca (Mahasiswa only)
      description: Digunakan oleh mahasiswa untuk menandai bahwa ia telah membaca info penjadwalan sidang terbaru (hanya satu arah, membuat isInfoPenjadwalanReaded menjadi true).
      tags:
        - Penjadwalan Sidang
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: Sidang registration ID (UUID)
      responses:
        "200":
          description: Info penjadwalan sidang berhasil ditandai sudah dibaca
          content:
            application/json:
              example:
                message: Info penjadwalan sidang berhasil ditandai sudah dibaca
                data:
                  id: d1a2b3c4-e5f6-7a8b-9c0d-1e2f3a4b5c6d
                  isInfoPenjadwalanReaded: true
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Info penjadwalan sidang berhasil ditandai sudah dibaca
                  data:
                    $ref: "#/components/schemas/PenjadwalanSidangItem"
        "401":
          description: Unauthorized
        "403":
          description: Access denied (Hanya mahasiswa pemilik pendaftaran yang dapat mengakses)
        "404":
          description: Sidang registration not found atau jadwal belum dipublikasikan

  /api/penjadwalan-sidang/export:
    get:
      summary: Export jadwal sidang & data user (ZIP)
      description: Mengunduh arsip ZIP yang berisi dua file Excel (.xlsx), yaitu jadwal sidang (TAPA_Sidang) dan data user (Data_User dengan sheet Mahasiswa & sheet Dosen).
      tags:
        - Penjadwalan Sidang
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: sidangPeriodId
          schema:
            type: string
            format: uuid
          description: ID Periode Sidang. Jika dikosongkan, otomatis mengekspor jadwal dan data user pada periode sidang yang saat ini aktif.
      responses:
        "200":
          description: Berhasil mengunduh file ZIP jadwal sidang dan data user
          content:
            application/zip:
              schema:
                type: string
                format: binary
        "401":
          description: Unauthorized
        "403":
          description: Access denied (Hanya Admin dan Dosen Ketua KK yang dapat mengakses)

  /api/penjadwalan-sidang/users:
    get:
      summary: Get data user (Admin only)
      description: |
        Mengambil daftar unik data user (Mahasiswa, Dosen Pembimbing 1 & 2, serta Dosen Penguji 1 & 2) pada pelaksanaan sidang di periode terkait.
      tags:
        - Penjadwalan Sidang
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: sidangPeriodId
          schema:
            type: string
            format: uuid
          description: ID Periode Sidang. Jika dikosongkan, otomatis mengambil data pada periode pelaksanaan sidang yang sedang aktif/mendatang.
        - in: query
          name: search
          schema:
            type: string
          description: Keyword pencarian berdasarkan nama, email, NIM, atau kode dosen
        - in: query
          name: peran
          schema:
            type: string
          description: Filter berdasarkan peran (contoh Mahasiswa, Dosen, Dosen Pembimbing, Dosen Penguji)
        - in: query
          name: page
          schema:
            type: integer
            default: 1
          description: Nomor halaman
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
          description: Jumlah data per halaman
      responses:
        "200":
          description: Data user berhasil diambil
          content:
            application/json:
              example:
                data:
                  - id: m1a2b3c4-e5f6-7a8b-9c0d-1e2f3a4b5c6d
                    userId: u1a2b3c4-e5f6-7a8b-9c0d-1e2f3a4b5c6d
                    nim: "1202200001"
                    kodeDosen: null
                    nama: Ahmad Dani
