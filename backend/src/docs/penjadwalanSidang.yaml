tags:
  - name: Penjadwalan Sidang
    description: Endpoint untuk manajemen penjadwalan sidang, penentuan dosen penguji, dan publikasi jadwal sidang

paths:
  /api/penjadwalan-sidang:
    get:
      summary: Get all penjadwalan sidang (paginated)
      description: |
        Mengambil daftar pendaftaran sidang untuk penjadwalan.
        - **Admin**: Dapat melihat seluruh data penjadwalan pada periode aktif (atau periode yang dipilih).
        - **Dosen Ketua KK**: Hanya dapat melihat data penjadwalan di mana Dosen Pembimbing 1 berasal dari Research Group (KK) yang dipimpinnya.
        - Pendaftaran dengan skema `Non Sidang` (`skemaSidangFinal = "Non Sidang"`) otomatis dikecualikan dari penjadwalan.
      tags:
        - Penjadwalan Sidang
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: sidangPeriodId
          schema:
            type: string
            format: uuid
          description: ID Periode Sidang. Jika dikosongkan, otomatis memfilter data pada periode sidang yang saat ini aktif.
        - in: query
          name: search
          schema:
            type: string
          description: Keyword pencarian untuk nama mahasiswa, NIM, atau judul tugas akhir
        - in: query
          name: sort
          schema:
            type: string
            enum: [newest, oldest]
            default: newest
          description: Urutan data berdasarkan waktu pembuatan (newest atau oldest, default newest)
        - in: query
          name: status
          schema:
            type: string
            enum:
              - "Pendaftaran Diterima"
              - "Siap Sidang"
              - "Penguji Ready"
              - "Penjadwalan Ready"
          description: Filter status pendaftaran / penjadwalan sidang (Penguji Ready & Penjadwalan Ready dihitung on the fly)
        - in: query
          name: skemaSidang
          schema:
            type: string
          description: Filter berdasarkan skema sidang final (skemaSidangFinal, contoh Reguler, Capstone, Sidang Khusus Prodi). Skema "Non Sidang" tidak ditampilkan pada endpoint ini.
        - in: query
          name: page
          schema:
            type: integer
            default: 1
          description: Nomor halaman
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
          description: Jumlah data per halaman
      responses:
        "200":
          description: Penjadwalan sidang data retrieved successfully with pagination
          content:
            application/json:
              example:
                data:
                  - id: d1a2b3c4-e5f6-7a8b-9c0d-1e2f3a4b5c6d
                    createdAt: "2026-11-10T08:00:00.000Z"
