                    peran: Mahasiswa
                    detailPeran: Mahasiswa
                  - id: d1a2b3c4-e5f6-7a8b-9c0d-1e2f3a4b5c6d
                    userId: u2a2b3c4-e5f6-7a8b-9c0d-1e2f3a4b5c6d
