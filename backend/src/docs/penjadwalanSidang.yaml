                  totalPages: 1
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/UserTerlibatSidangItem"
                  pagination:
                    $ref: "#/components/schemas/PaginationMeta"
        "401":
          description: Unauthorized
        "403":
          description: Access denied (Hanya admin yang dapat mengakses)

  /api/penjadwalan-sidang/set-penguji/batch:
    put:
      summary: Set dosen penguji sidang batch (Ketua KK only)
      description: Menentukan dosen penguji secara massal. Dosen pembimbing tidak dapat menjadi dosen penguji. Tindakan dibatasi jika pendaftaran dikunci atau periode telah dipublikasikan.
      tags:
        - Penjadwalan Sidang
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/BatchSetPengujiItem"
      responses:
        "200":
          description: Dosen penguji sidang batch berhasil ditentukan
          content:
            application/json:
              example:
                message: Dosen penguji sidang batch berhasil ditentukan
                data:
                  - id: d1a2b3c4-e5f6-7a8b-9c0d-1e2f3a4b5c6d
                    dosenPenguji1:
                      id: d2a2b3c4-e5f6-7a8b-9c0d-1e2f3a4b5c6d
                      name: Dr. Penguji Satu, M.Kom.
                      nip: "198002022005012002"
                    dosenPenguji2: null
                    statusPenjadwalan: Penguji Ready
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Dosen penguji sidang batch berhasil ditentukan
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/PenjadwalanSidangItem"
        "400":
          description: Validation error / Jadwal bentrok / Sidang terkunci / Penguji merangkap pembimbing
        "401":
          description: Unauthorized
        "403":
          description: Access denied (Hanya dosen dengan status Ketua KK yang dapat mengakses)
        "404":
          description: Sidang registration or dosen not found

